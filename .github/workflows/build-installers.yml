name: Build AdvancedAI installers

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advancedai-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            arch: Apple Silicon
            os: macos-14
            build_args: --mac --arm64
            artifact: advancedai-macos-arm64
          - platform: macOS
            arch: Intel
            os: macos-14
            build_args: --mac --x64
            artifact: advancedai-macos-x64
          - platform: Windows
            arch: x64
            os: windows-latest
            build_args: --win --x64
            artifact: advancedai-windows-x64
          - platform: Linux
            arch: x64
            os: ubuntu-24.04
            build_args: --linux deb --x64
            artifact: advancedai-linux-x64-deb
          - platform: Linux
            arch: ARM64
            os: ubuntu-24.04
            build_args: --linux deb --arm64
            artifact: advancedai-linux-arm64-deb

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.14.0
          # pnpm is installed in the following step; setup-node's automatic
          # package-manager cache otherwise tries to execute pnpm too early.
          package-manager-cache: false

      - name: Set up pnpm (Unix)
        if: runner.os != 'Windows'
        shell: bash
        # Keep this version aligned with package.json#packageManager. Using
        # npm here avoids pnpm/action-setup's deprecated Node.js 20 runtime.
        run: |
          npm install --global pnpm@10.33.0
          pnpm_prefix="$(npm prefix --global)"
          echo "$pnpm_prefix" >> "$GITHUB_PATH"
          echo "$pnpm_prefix/bin" >> "$GITHUB_PATH"
          export PATH="$pnpm_prefix:$pnpm_prefix/bin:$PATH"
          pnpm --version

      - name: Set up pnpm (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm install --global pnpm@10.33.0
          $pnpmPrefix = (npm prefix --global).Trim()
          Add-Content -Path $env:GITHUB_PATH -Value $pnpmPrefix
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $pnpmPrefix 'bin')
          & (Join-Path $pnpmPrefix 'pnpm.cmd') --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        env:
          # AdvancedAI is intentionally distributed unsigned until a
          # platform-specific signing certificate is configured.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm run package -- ${{ matrix.build_args }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: |
            release/build/*.dmg
            release/build/*.exe
            release/build/*.deb
          if-no-files-found: error
          retention-days: 14
